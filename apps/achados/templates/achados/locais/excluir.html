{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir local</title>
    <link rel="stylesheet" href="{% static 'achados/css/style.css' %}">
</head>

<body>
    <header>
        <h1>Excluir local</h1>
    </header>

    <main class="container">
        <div class="card">
            <h3>Deseja excluir "{{ local.nome }}"?</h3>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-sair">Excluir</button>
                <a href="{% url 'achados:listar_locais' %}" class="btn">
                    Cancelar
                </a>
            </form>
        </div>
    </main>
</body>
</html>
