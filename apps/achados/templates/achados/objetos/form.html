{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <link rel="stylesheet" href="{% static 'achados/css/style.css' %}">
</head>

<body>

<header>
    <div>
        <h1>{{ titulo }}</h1>
        <p>Atualize as informações do objeto encontrado.</p>
    </div>
</header>

<main class="container">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Salvar alterações
        </button>

        <a href="{% url 'achados:index' %}" class="btn">
            Cancelar
        </a>
    </form>

</main>

</body>
</html>
